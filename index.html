<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>A Life, Unfolding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Ambient background: blurry vegetation (or your intro video) -->
  <div id="ambient">
    <canvas id="veg"></canvas>
    <video id="introVideo" muted loop playsinline hidden></video>
    <div id="ambientPhoto"></div>
  </div>

  <!-- Opening screen -->
  <section id="intro" aria-label="Welcome">
    <div class="intro-inner">
      <h1 id="siteTitle"></h1>
      <p id="siteSubtitle" class="subtitle"></p>
      <button id="enterBtn" class="enter"></button>
      <p class="hint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="18" cy="12" r=".9"/></svg>
        <span id="introHint"></span>
      </p>
    </div>
  </section>

  <!-- Main experience -->
  <main id="app" hidden>
    <section id="stage" aria-live="polite">
      <div id="stageInner"></div>
    </section>

    <section id="timeline" aria-label="Timeline">
      <div class="controls">
        <button id="prevBtn" title="Previous (←)" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <button id="playBtn" title="Play / pause (space)" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg>
        </button>
        <button id="nextBtn" title="Next (→)" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <div id="legend"></div>
        <div id="dwell"><div id="dwellBar"></div></div>
      </div>
      <div id="viewport">
        <div id="track"></div>
        <div id="playhead"><span id="playheadYear"></span></div>
      </div>
    </section>
  </main>

  <div id="rotateNote" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9a8 8 0 0 1 4-5M21 15a8 8 0 0 1-4 5"/></svg>
    Turn your device sideways for the full timeline
  </div>

  <script src="content.js"></script>
  <script src="media-entries.js"></script>
  <script src="app.js"></script>
</body>
</html>
